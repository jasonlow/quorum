<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Concilium — AI Committee for Atlas Capital</title>
<meta name="viewport" content="width=1440" />
<link rel="stylesheet" href="pro-styles.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body, #root { height: 100%; }
  body { overflow: hidden; }
  .app-shell {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  /* Top "chrome" — workspace switcher + breadcrumb + global actions */
  .topbar {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 14px 0 14px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface);
    flex: 0 0 auto;
  }
  .ws-switch {
    display:flex; align-items:center; gap:8px;
    padding: 4px 10px 4px 6px;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    background: var(--bg);
    cursor: pointer;
    font-size: 12px;
  }
  .ws-switch .ws-mark {
    width:18px; height:18px; border-radius:4px;
    background: var(--ink); color: var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--serif); font-size: 11px; line-height:1;
  }
  .crumbs { display:flex; align-items:center; gap:8px; color: var(--ink-3); font-size: 12px; }
  .crumbs .sep { color: var(--ink-4); }
  .crumbs .here { color: var(--ink); font-weight: 500; }

  .topbar-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .icon-btn {
    width:30px; height:30px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    background: transparent; border: 1px solid transparent;
    color: var(--ink-2); cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg); border-color: var(--hairline); }

  /* Main split */
  .main-split { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  .stage > * { min-height: 0; }

  /* Density modes */
  body.density-compact { font-size: 12.5px; }
  body.density-roomy   { font-size: 13.5px; }

  /* Dark theme override (subtle dusk variant) */
  body.theme-dusk {
    --bg:        #1c1a16;
    --bg-2:      #15130f;
    --surface:   #24211c;
    --surface-2: #2c2823;
    --tint:      #2e2a22;
    --ink:       #f1ebdc;
    --ink-2:     #d4cdb9;
    --ink-3:     #9a907a;
    --ink-4:     #6b624f;
    --hairline:  #3a342a;
    --hairline-2:#2c2823;
    --accent:    #e08a4c;
    --accent-2:  #b86a30;
    --accent-bg: #3a2a1c;
  }

  /* page chrome — no overlay in clean theme */
  body::before { display: none; }
</style>
</head>

<body class="theme-paper density-default">
<div id="root"></div>

<script type="text/babel" src="pro-ui.jsx"></script>
<script type="text/babel" src="pro-screens-a.jsx"></script>
<script type="text/babel" src="pro-screens-b.jsx"></script>
<script type="text/babel" src="pro-screens-c.jsx"></script>
<script type="text/babel" src="pro-screens-auth.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ── Edit-mode protocol (Tweaks) ─────────────────────────────
const DEFAULTS = /*EDITMODE-BEGIN*/{
  "screen": "dashboard",
  "committee": "risk",
  "phase": "mid",
  "theme": "paper",
  "density": "default",
  "boardroomLayout": "grid",
  "qaFormat": "thread"
}/*EDITMODE-END*/;

function useEditMode(defaults) {
  const [state, setState] = useState(defaults);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    function onMsg(e) {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode')   setOpen(true);
      if (d.type === '__deactivate_edit_mode') setOpen(false);
    }
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  function set(patch) {
    setState(s => ({ ...s, ...patch }));
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits: patch }, '*');
  }
  return [state, set, open, setOpen];
}

// ── App shell ───────────────────────────────────────────────
function App() {
  const [t, setT, tweaksOpen, setTweaksOpen] = useEditMode(DEFAULTS);

  useEffect(() => {
    document.body.className = `theme-${t.theme || 'paper'} density-${t.density || 'default'}`;
  }, [t.theme, t.density]);

  const uc = COMMITTEES[t.committee] || COMMITTEES.risk;

  // Map sidebar nav ids → screens
  // Auth screens render full-bleed without sidebar/topbar
  const AUTH_SCREENS = ['login','register','verify','forgot'];
  if (AUTH_SCREENS.includes(t.screen)) {
    const go = (s)=>setT({ screen:s });
    return (
      <>
        {t.screen==='login'    && <ScreenLogin    go={go} />}
        {t.screen==='register' && <ScreenRegister go={go} />}
        {t.screen==='verify'   && <ScreenVerify   go={go} />}
        {t.screen==='forgot'   && <ScreenForgot   go={go} />}
        {tweaksOpen && <TweaksPanel t={t} set={setT} onClose={()=>{
          setTweaksOpen(false);
          window.parent.postMessage({ type:'__edit_mode_dismissed' }, '*');
        }} />}
      </>
    );
  }

  function nav(id) {
    if (id === 'dashboard' || id === 'sessions' || id === 'archive') setT({ screen:'dashboard' });
    else if (id === 'convene') setT({ screen:'convene' });
    else if (id === 'boardroom') setT({ screen:'boardroom' });
    else if (id === 'cos') setT({ screen:'cos' });
    else if (id === 'qa') setT({ screen:'qa' });
    else if (id === 'brief') setT({ screen:'brief' });
    else if (id === 'agents' || id === 'committees') setT({ screen:'agent' });
    else setT({ screen: id });
  }

  // Breadcrumb for top bar
  const crumb = (() => {
    switch (t.screen) {
      case 'dashboard': return ['Workspace','Dashboard'];
      case 'convene':   return ['Workspace','New convening', uc.short];
      case 'boardroom': return ['Live session', uc.short, 'Boardroom'];
      case 'cos':       return ['Live session', uc.short, 'Chief of Staff'];
      case 'qa':        return ['Live session', uc.short, 'Discussion'];
      case 'brief':     return ['Live session', uc.short, 'Brief'];
      case 'agent':     return ['Manage','Agent library','Regulatory Hawk'];
      case 'login':     return ['Authentication','Sign in'];
      case 'register':  return ['Authentication','Request access'];
      default: return ['Workspace','Dashboard'];
    }
  })();

  return (
    <div className="app-shell">
      {/* TOP BAR */}
      <div className="topbar">
        <div className="ws-switch" title="Workspace switcher">
          <span className="ws-mark">A</span>
          <span style={{ fontWeight:500 }}>Atlas Capital</span>
          <span style={{ color:'var(--ink-4)' }}>·</span>
          <span style={{ color:'var(--ink-3)' }}>Singapore</span>
          <Icon name="down" size={11} style={{ color:'var(--ink-4)', marginLeft:2 }} />
        </div>

        <div className="crumbs">
          {crumb.map((c,i)=>(
            <span key={i} style={{ display:'inline-flex', alignItems:'center', gap:8 }}>
              {i>0 && <span className="sep">/</span>}
              <span className={i===crumb.length-1 ? 'here' : ''}>{c}</span>
            </span>
          ))}
        </div>

        <div className="topbar-right">
          <Pill icon="sparkle" tone="ink">Live session · {uc.short}</Pill>
          <button className="icon-btn" title="Notifications"><Icon name="inbox" size={14} /></button>
          <button className="icon-btn" title="Help"><Icon name="search" size={14} /></button>
          <Btn sm kind="primary" icon="plus" onClick={()=>setT({ screen:'convene' })}>Convene</Btn>
          <Avatar initials="PA" rim="accent" size="sm" />
        </div>
      </div>

      {/* SIDEBAR + STAGE */}
      <div className="main-split">
        <Sidebar active={t.screen} onNav={nav} committeeKey={t.committee} />
        <div className="stage">
          {t.screen === 'dashboard' && <ScreenDashboard go={(s)=>setT({ screen:s })} />}
          {t.screen === 'convene'   && <ScreenConvene   committee={t.committee} go={(s)=>setT({ screen:s })} />}
          {t.screen === 'boardroom' && <ScreenBoardroom committee={t.committee} phase={t.phase} layout={t.boardroomLayout} go={(s)=>setT({ screen:s })} />}
          {t.screen === 'cos'       && <ScreenCoSGate   committee={t.committee} go={(s)=>setT({ screen:s })} />}
          {t.screen === 'qa'        && <ScreenQA        committee={t.committee} format={t.qaFormat} go={(s)=>setT({ screen:s })} />}
          {t.screen === 'brief'     && <ScreenBrief     committee={t.committee} go={(s)=>setT({ screen:s })} />}
          {t.screen === 'agent'     && <ScreenAgent     go={(s)=>setT({ screen:s })} />}
        </div>
      </div>

      {tweaksOpen && <TweaksPanel t={t} set={setT} onClose={()=>{
        setTweaksOpen(false);
        window.parent.postMessage({ type:'__edit_mode_dismissed' }, '*');
      }} />}
    </div>
  );
}

// ── Tweaks panel (custom — fits the editorial chrome) ───────
function TweaksPanel({ t, set, onClose }) {
  const screens = [
    ['login','Sign in'],
    ['register','Register'],
    ['verify','Verify'],
    ['forgot','Forgot pwd'],
    ['dashboard','Dashboard'],
    ['convene','Convene'],
    ['boardroom','Boardroom'],
    ['cos','CoS gate'],
    ['qa','Discussion'],
    ['brief','Brief'],
    ['agent','Agent profile'],
  ];
  const committees = [
    ['risk','Risk'], ['onboard','Onboarding'], ['change','Change'],
  ];
  const phases = [['early','Early'],['mid','Mid'],['late','Late']];
  const themes = [['paper','Paper'],['dusk','Dusk']];
  const densities = [['compact','Compact'],['default','Default'],['roomy','Roomy']];

  function Group({ label, value, options, k }) {
    return (
      <div className="col gap-2">
        <div className="t-tiny">{label}</div>
        <div className="row gap-1" style={{ flexWrap:'wrap' }}>
          {options.map(([v, lbl])=>(
            <button key={v}
              onClick={()=>set({ [k]:v })}
              className="btn btn-sm"
              style={{
                background: value===v ? 'var(--ink)' : 'var(--surface)',
                color: value===v ? 'var(--surface)' : 'var(--ink-2)',
                borderColor: value===v ? 'var(--ink)' : 'var(--hairline)',
              }}>{lbl}</button>
          ))}
        </div>
      </div>
    );
  }
  return (
    <div style={{
      position:'fixed', right:18, bottom:18, width:280, zIndex:200,
      background:'var(--surface)', border:'1px solid var(--hairline)',
      borderRadius:10, boxShadow:'var(--shadow-2)',
      display:'flex', flexDirection:'column',
    }}>
      <div className="row gap-2" style={{ padding:'10px 12px', borderBottom:'1px solid var(--hairline-2)' }}>
        <Icon name="sparkle" size={12} style={{ color:'var(--accent)' }} />
        <span style={{ fontFamily:'var(--serif)', fontSize:15 }}>Tweaks</span>
        <div style={{ flex:1 }} />
        <button className="icon-btn" onClick={onClose} title="Close"><Icon name="x" size={12} /></button>
      </div>
      <div className="col gap-3" style={{ padding:12, overflow:'auto', maxHeight:'70vh' }}>
        <Group label="Screen"           value={t.screen}    k="screen"           options={screens} />
        <Group label="Committee"        value={t.committee} k="committee"        options={committees} />
        <Group label="Deliberation phase" value={t.phase}   k="phase"            options={phases} />
        <div className="hairline-t" style={{ paddingTop:10, display:'flex', flexDirection:'column', gap:10 }}>
          <Group label="Theme"   value={t.theme}   k="theme"   options={themes} />
          <Group label="Density" value={t.density} k="density" options={densities} />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
