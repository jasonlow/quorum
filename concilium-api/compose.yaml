name: concilium

services:
  postgres:
    image: postgres:16-alpine
    container_name: concilium-postgres
    environment:
      POSTGRES_DB: concilium
      POSTGRES_USER: concilium
      POSTGRES_PASSWORD: concilium
    ports:
      - "5432:5432"
    volumes:
      - concilium-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concilium -d concilium"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  concilium-pg-data:
