# Local development profile — default profile.
# Uses DeepSeek V4 (deepseek-chat) via Spring AI's OpenAI-compatible client.
#
# Required env var:
#   DEEPSEEK_API_KEY=sk-...
#
# DeepSeek's API is OpenAI-wire-compatible, so we configure it under
# the standard spring.ai.openai.* namespace with an overridden base-url.
spring:
  ai:
    # Tell Spring AI to expose only the OpenAI-compatible ChatModel as the
    # primary bean. The Ollama starter is on the classpath but inactive.
    model:
      chat: openai
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:not-set}
      chat:
        options:
          model: deepseek-chat        # DeepSeek V4 — used by agents + brief
          temperature: 0.7

# Per-agent / per-role model overrides. CoS uses the reasoner model for
# rigorous critique; agents and brief consolidator use the default chat
# model above. Override either via env vars.
concilium:
  llm:
    cos-model: ${CONCILIUM_COS_MODEL:deepseek-reasoner}
