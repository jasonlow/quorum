# Offline fallback profile — uses Ollama running on the local machine.
# Activate with: SPRING_PROFILES_ACTIVE=ollama ./mvnw spring-boot:run
#
# Prerequisites:
#   brew install ollama
#   ollama pull llama3.1:8b
#   ollama serve   (or run via the menu-bar app)
spring:
  ai:
    # Active provider in this profile.
    model:
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
          temperature: 0.7
