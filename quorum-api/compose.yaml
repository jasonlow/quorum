name: quorum

services:
  postgres:
    image: postgres:16-alpine
    container_name: quorum-postgres
    environment:
      POSTGRES_DB: quorum
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: quorum
    ports:
      - "5432:5432"
    volumes:
      - quorum-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorum -d quorum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quorum-pg-data:
